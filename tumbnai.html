<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Cards</title>
    <style>
      .content-wrapper {
        margin: 0 auto;
        max-width: 1200px;
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        padding: 0.5rem;
      }

      .news-card {
        margin: 0.25rem;
        position: relative;
        height: 10rem;
        overflow: hidden;
        flex: 1;
        min-width: 250px;
        max-width: 300px;
      }

      .news-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 50%,
          rgba(0, 0, 0, 0.7) 100%
        );
        z-index: 0;
      }

      .news-card__card-link {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .news-card__image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 3s ease;
        z-index: -1;
      }
      .news-card__text-wrapper {
        position: absolute;
        bottom: 0px;
        padding: 1rem;
        color: white;
        transition: background-color 1.5s ease;
      }

      .news-card__title {
        margin-bottom: 0.5rem;
        transition: color 1s ease;
      }

      .news-card__post-date {
        font-size: 0.7rem;
        margin-bottom: 1rem;
        color: #ccc;
      }

      .news-card__details-wrapper {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 1.5s ease, opacity 1s ease;
      }

      .news-card__excerpt {
        font-weight: 300;
        font-size: 0.9rem;
      }

      @media (min-width: 900px) {
        .news-card {
          height: 14rem;
        }

        .news-card:hover .news-card__image {
          transform: scale(1.1);
        }
      }
      /*---- MODAL ----*/
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 1rem; 
        box-sizing: border-box;
      }

      .modal-content {
        background-color: #fff;
        margin: auto;
        padding: 1rem;
        border-radius: 8px;
        max-width: 100%;
        max-height: 90vh;
      }

      .modal-close {
        position: absolute;
        top: 2rem;
        right: 3rem;
        font-size: 2rem;
        cursor: pointer;
      }

      #modal-images img {
        width: 100%;
        max-width: 300px;
        margin: 0.5rem;
      }

      /*---- BTN --*/

      .button-1 {
        background-color: #ea4c89;
        border-radius: 8px;
        border-style: none;
        box-sizing: border-box;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font-family: "Haas Grot Text R Web", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        font-weight: 500;
        height: 40px;
        line-height: 20px;
        list-style: none;
        margin: 0;
        outline: none;
        padding: 10px 16px;
        position: relative;
        text-align: center;
        text-decoration: none;
        transition: color 100ms;
        vertical-align: baseline;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      .button-1:hover,
      .button-1:focus {
        background-color: #f082ac;
      }
    </style>
  </head>
  <body>
    <div class="content-wrapper" id="portfolio-container"></div>

    <!-- Modal -->
    <div id="portfolio-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <div class="modal-body">
          <h2 id="modal-title"></h2>
          <h2>Project Description</h2>
          <p id="modal-description"></p>
          <div id="modal-images"></div>
          <div id="modal-skills"></div>
          <button
            id="modal-live"
            target="_blank"
            class="button-1"
            role="button"
          >
            Live Site
          </button>
          <a id="modal-github" target="_blank">GitHub</a>
          <p id="modal-published"></p>
          <p id="modal-company"></p>
        </div>
      </div>
    </div>

    <script src="./js/map.js"></script>
  </body>
</html>
