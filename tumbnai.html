<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Layout</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #e5e5e5;
        padding: 2rem;
        color: #333;
      }

      .heading {
        text-align: center;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 2rem;
        color: #1a1a1a;
      }

      .portfolio-grid {
        margin-top: 150px;
        display: grid;
        gap: 2rem;
        grid-template-columns: 2fr 3fr;
        height: 50vh;
      }

      .main-card {
        grid-column: 1 / span 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .side-cards {
        display: grid;
        grid-template-rows: repeat(2, 1fr);
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
      }

      .card {
        background-color: #fff;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .card-image-container {
        position: relative;
        flex-grow: 1; /* Make image container fill available space */
        overflow: hidden;
      }

      .card-image {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures images fill their container without distortion */
        display: block;
      }

      .card-text {
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1rem;
        flex-shrink: 0;
      }

      .card-title {
        font-weight: bold;
      }

      .card-category {
        font-size: 0.9rem;
        color: #777;
      }

      .year-badge {
        position: absolute;
        top: 1rem;
        left: 1rem;
        background-color: #000;
        color: #fff;
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 4px;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .portfolio-grid {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="heading">Recent Projects</h1>

    <div class="portfolio-grid">
      <div class="card main-card">
        <div class="card-image-container">
          <img
            src="https://i.imgur.com/GzB9M2V.jpeg"
            alt="Martians"
            class="card-image"
          />
          <span class="year-badge">2025</span>
        </div>
        <div class="card-text">
          <span class="card-title">Martians</span>
          <span class="card-category">Branding</span>
        </div>
      </div>

      <div class="side-cards">
        <div class="card">
          <div class="card-image-container">
            <img
              src="https://i.imgur.com/6S305a4.jpeg"
              alt="La Lily"
              class="card-image"
            />
            <span class="year-badge">2025</span>
          </div>
          <div class="card-text">
            <span class="card-title">La Lily</span>
            <span class="card-category">Web Design</span>
          </div>
        </div>
        <div class="card">
          <div class="card-image-container">
            <img
              src="https://i.imgur.com/1Dq56fN.jpeg"
              alt="Blur Lines"
              class="card-image"
            />
            <span class="year-badge">2025</span>
          </div>
          <div class="card-text">
            <span class="card-title">Blur Lines</span>
            <span class="card-category">Photography</span>
          </div>
        </div>
        <div class="card">
          <div class="card-image-container">
            <img
              src="https://i.imgur.com/yFj0461.jpeg"
              alt="Project 3"
              class="card-image"
            />
            <span class="year-badge">2025</span>
          </div>
          <div class="card-text">
            <span class="card-title">Project 3</span>
            <span class="card-category">Category</span>
          </div>
        </div>
        <div class="card">
          <div class="card-image-container">
            <img
              src="https://i.imgur.com/0FwJ6cW.jpeg"
              alt="Project 4"
              class="card-image"
            />
            <span class="year-badge">2025</span>
          </div>
          <div class="card-text">
            <span class="card-title">Project 4</span>
            <span class="card-category">Category</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
