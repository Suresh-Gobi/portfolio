<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Products Portfolio</title>
    <style>
      body {
        background: #ffffff;
        color: #161616;
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 2rem;
      }

      /* header */
      .portfolio-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: center;
        padding-bottom: 3rem;
      }
      .portfolio-title {
        text-align: center;
        font-size: 3rem;
        font-weight: 600;
        text-transform: lowercase;
        margin-bottom: 1rem;
      }

      /* filters + view toggles container */
      .header-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      /* filters */
      .filters button {
        background: transparent;
        border: none;
        color: #888;
        margin-right: 1rem;
        font-size: 1rem;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .filters button.active {
        color: #000;
        font-weight: bold;
      }

      /* view toggles */
      .view-toggles {
        display: flex;
        gap: 0.5rem;
      }
      .toggle-btn {
        width: 32px;
        height: 32px;
        border: 1px solid #555;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
        color: #888;
        font-size: 1rem;
        line-height: 1;
      }
      .toggle-btn.active {
        background: #000;
        color: #fff;
      }

      /* portfolio grid */
      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3rem;
        transition: all 0.3s ease;
      }
      .portfolio-grid.list-view {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* Hide images in list view */
      .portfolio-grid.list-view .image-container {
        display: none;
      }

      /* portfolio item */
      .portfolio-item {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
      }
      .image-container {
        position: relative;
        background: #111;
        padding-top: 75%; /* 4:3 ratio */
        overflow: hidden;
      }
      .image-container img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .portfolio-item:hover img {
        transform: scale(1.05);
      }
      .details {
        display: flex;
        justify-content: space-between;
        padding-top: 1rem;
      }
      .details .title {
        font-size: 1.4rem;
        margin: 0;
        font-weight: 400;
        text-transform: lowercase;
      }
      .details .tags,
      .details .year {
        font-size: 0.85rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <header class="portfolio-header">
      <h1 class="portfolio-title">Creating next level digital products</h1>
      <div class="header-controls">
        <nav class="filters">
          <button class="filter-btn active" data-filter="all">all</button>
          <button class="filter-btn" data-filter="design">design</button>
          <button class="filter-btn" data-filter="development">
            development
          </button>
        </nav>
        <div class="view-toggles">
          <button class="toggle-btn list-view-btn">≡</button>
          <button class="toggle-btn grid-view-btn active">▦</button>
        </div>
      </div>
    </header>

    <main class="portfolio-grid">
      <a href="#" class="portfolio-item" data-category="design development">
        <div class="image-container">
          <img src="https://picsum.photos/id/1018/800/600" alt="The Damai" />
        </div>
        <div class="details">
          <h2 class="title">the damai</h2>
          <div class="meta">
            <span class="tags">design & development</span>
            <span class="year">2024</span>
          </div>
        </div>
      </a>

      <a href="#" class="portfolio-item" data-category="design">
        <div class="image-container">
          <img src="https://picsum.photos/id/1025/800/600" alt="Fabric" />
        </div>
        <div class="details">
          <h2 class="title">fabric™</h2>
          <div class="meta">
            <span class="tags">design</span>
            <span class="year">2023</span>
          </div>
        </div>
      </a>

      <a href="#" class="portfolio-item" data-category="development">
        <div class="image-container">
          <img src="https://picsum.photos/id/1035/800/600" alt="NextGen" />
        </div>
        <div class="details">
          <h2 class="title">nextgen</h2>
          <div class="meta">
            <span class="tags">development</span>
            <span class="year">2022</span>
          </div>
        </div>
      </a>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      // animate portfolio items on load
      document.addEventListener("DOMContentLoaded", () => {
        const items = document.querySelectorAll(".portfolio-item");
        gsap.set(items, { autoAlpha: 0, y: 50 });
        gsap.to(items, {
          duration: 0.8,
          autoAlpha: 1,
          y: 0,
          ease: "power3.out",
          stagger: 0.15,
        });
      });

      // filter logic
      const filterBtns = document.querySelectorAll(".filter-btn");
      const items = document.querySelectorAll(".portfolio-item");

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const filter = btn.dataset.filter;

          items.forEach((item) => {
            const categories = item.dataset.category.split(" ");
            if (filter === "all" || categories.includes(filter)) {
              gsap.to(item, {
                autoAlpha: 1,
                scale: 1,
                duration: 0.3,
                onStart: () => {
                  item.style.display = "flex"; // ✅ show again
                }
              });
              item.style.pointerEvents = "auto";
            } else {
              gsap.to(item, {
                autoAlpha: 0,
                scale: 0.9,
                duration: 0.3,
                onComplete: () => {
                  item.style.display = "none"; // ✅ hide from layout
                }
              });
              item.style.pointerEvents = "none";
            }
          });
        });
      });

      // view toggle logic
      const gridBtn = document.querySelector(".grid-view-btn");
      const listBtn = document.querySelector(".list-view-btn");
      const grid = document.querySelector(".portfolio-grid");

      gridBtn.addEventListener("click", () => {
        grid.classList.remove("list-view");
        gridBtn.classList.add("active");
        listBtn.classList.remove("active");
      });

      listBtn.addEventListener("click", () => {
        grid.classList.add("list-view");
        listBtn.classList.add("active");
        gridBtn.classList.remove("active");
      });
    </script>
  </body>
</html>
