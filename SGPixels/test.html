<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Footer Animation</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: Helvetica, sans-serif;
      }

      #scroll-animate {
        overflow: hidden;
      }

      #scroll-animate-main {
        width: 100%;
        left: 0;
        position: fixed;
      }

      footer {
        width: 100%;
        height: 100vh;
        background: gray;
        bottom: -100px;
        position: fixed;
        z-index: -1;
        transition: bottom 0.4s cubic-bezier(0, 0, 0, 1);
      }

      .content {
        height: 150vh;
        min-height: 1500px;
        background: #ededed;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }

      .wrapper-parallax {
        margin-bottom: 100vh;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
        border-bottom-right-radius: 90% 30%;
        overflow: hidden;
      }

      h1 {
        margin: 0;
        text-transform: uppercase;
        text-align: center;
        font-size: 150px;
      }

      .content h1 {
        line-height: 1000px;
        color: #999;
      }

      footer h1 {
        line-height: 100vh;
        color: #fff;
      }

      footer,
      #scroll-animate-main {
        transition: all 0.4s cubic-bezier(0, 0, 0, 1);
      }
    </style>
  </head>
  <body>
    <div id="scroll-animate">
      <div id="scroll-animate-main">
        <div class="wrapper-parallax">
          <section class="content">
            <h1>Content</h1>
          </section>

          <footer>
            <h1>Footer</h1>
          </footer>
        </div>
      </div>
    </div>
    <!-- GSAP CDN (latest stable versions) -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script>
      function scrollFooter(scrollY, heightFooter) {
        const footer = document.querySelector("footer");
        if (scrollY >= heightFooter) {
          footer.style.bottom = "0px"; // show
        } else {
          footer.style.bottom = "-" + heightFooter + "px"; // hide
        }
      }

      window.addEventListener("load", () => {
        const windowHeight = window.innerHeight;
        const footer = document.querySelector("footer");
        const footerHeight = footer.offsetHeight;
        const contentHeight = document.querySelector(".content").offsetHeight;
        const heightDocument = windowHeight + contentHeight;

        // set scroll container size
        document
          .querySelectorAll("#scroll-animate, #scroll-animate-main")
          .forEach((el) => (el.style.height = heightDocument + "px"));

        // push content below viewport initially
        //   document.querySelector(".wrapper-parallax").style.marginTop =
        //     windowHeight + "px";

        scrollFooter(window.scrollY, footerHeight);

        // on scroll
        window.onscroll = function () {
          const scroll = window.scrollY;

          document.getElementById("scroll-animate-main").style.top =
            "-" + scroll + "px";

          scrollFooter(scroll, footerHeight);
        };
      });
    </script>
  </body>
</html>
