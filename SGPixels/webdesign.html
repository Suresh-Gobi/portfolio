<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Damai with Cards</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background: #fff;
        color: #111;
        overflow-x: hidden;
      }

      .layout {
        display: flex;
        width: 100%;
        min-height: 100vh;
      }

      /* LEFT SECTION (fixed text) */
      .project-info {
        flex: 0 0 40%;
        padding: 80px 40px;
        position: sticky;
        top: 0;
        height: 100vh;
        background: #fff;
        border-right: 1px solid #eee;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .title {
        font-size: 48px;
        font-weight: 400;
        margin-bottom: 50px;
      }

      .info-grid {
        display: grid;
        gap: 30px;
      }

      .label {
        font-size: 12px;
        letter-spacing: 1px;
        color: #777;
        margin-bottom: 8px;
        text-transform: uppercase;
        border-bottom: 1px solid #e5e5e5;
        padding-bottom: 6px;
      }

      .content {
        font-size: 16px;
        line-height: 1.6;
      }

      /* RIGHT SECTION (cards scroll + animate) */
      .cards-area {
        flex: 1;
        padding: 100px 20px;
      }

      .card-wrapper {
        width: 100%;
        perspective: 500px;
        margin-bottom: 6%;
      }

      .card {
        width: 100%;
        height: 450px;
        border-radius: 10px;
        background-size: cover;
        background-position: center;
      }

      .card.one {
        background-image: url("https://assets.codepen.io/16327/portrait-pattern-1.jpg");
      }
      .card.two {
        background-image: url("https://assets.codepen.io/16327/portrait-pattern-2.jpg");
      }
      .card.three {
        background-image: url("https://assets.codepen.io/16327/portrait-pattern-3.jpg");
      }
      .card.four {
        background-image: url("https://assets.codepen.io/16327/portrait-pattern-4.jpg");
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }
        .project-info {
          position: relative;
          height: auto;
          border-right: none;
        }
      }
    </style>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div class="layout">
      <!-- LEFT FIXED SECTION -->
      <section class="project-info">
        <h1 class="title">The Damai</h1>
        <div class="info-grid">
          <div class="info-block">
            <p class="label">ROLE / SERVICES</p>
            <p class="content">Design &amp; Development</p>
          </div>
          <div class="info-block">
            <p class="label">CREDITS</p>
            <p class="content">
              Design: Christy Lammerink <br />
              Design: Tom de Koning <br />
              Photography: Niké Schuurmans
            </p>
          </div>
          <div class="info-block">
            <p class="label">LOCATION &amp; YEAR</p>
            <p class="content">Bali, Indonesia © 2024</p>
          </div>
        </div>
      </section>

      <!-- RIGHT SCROLL SECTION -->
      <div class="cards-area">
        <div class="card-wrapper"><div class="card one"></div></div>
        <div class="card-wrapper"><div class="card two"></div></div>
        <div class="card-wrapper"><div class="card three"></div></div>
        <div class="card-wrapper"><div class="card four"></div></div>
      </div>
    </div>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const cardsWrappers = gsap.utils.toArray(".card-wrapper");
      const cards = gsap.utils.toArray(".card");

      cardsWrappers.forEach((wrapper, i) => {
        const card = cards[i];
        let scale = 1,
          rotation = 0;
        if (i !== cards.length - 1) {
          scale = 0.9 + 0.025 * i;
          rotation = -10;
        }

        gsap.to(card, {
          scale: scale,
          rotationX: rotation,
          transformOrigin: "top center",
          ease: "none",
          scrollTrigger: {
            trigger: wrapper,
            start: "top 20%",
            end: "bottom bottom",
            endTrigger: ".wrapper",
            scrub: true,
            pin: wrapper,
            pinSpacing: false,
            markers: true, // uncomment to debug
          },
        });
      });
    </script>
  </body>
</html>
