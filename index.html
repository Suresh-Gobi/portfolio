<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suresh Gobi | Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- GSAP & ScrollTrigger CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div id="preloader">
      <div id="logo"></div>

      <div class="loading-container">
        <div class="loading-screen">
          <div class="numbers">
            <div class="number number-2 number-ten-times">
              <div class="number-wrap">
                <p class="number-p">0</p>
                <p class="number-p">1</p>
                <p class="number-p">2</p>
                <p class="number-p">3</p>
                <p class="number-p">4</p>
                <p class="number-p">5</p>
                <p class="number-p">6</p>
                <p class="number-p">7</p>
                <p class="number-p">8</p>
                <p class="number-p">9</p>
              </div>
            </div>

            <div class="number number-3 number-ten-times">
              <div class="number-wrap">
                <p class="number-p">0</p>
                <p class="number-p">1</p>
                <p class="number-p">2</p>
                <p class="number-p">3</p>
                <p class="number-p">4</p>
                <p class="number-p">5</p>
                <p class="number-p">6</p>
                <p class="number-p">7</p>
                <p class="number-p">8</p>
                <p class="number-p">9</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- <div class="custom-cursor">
      <div class="cursor-circle">
        <span
          >scroll <br />
          to <br />
          view</span
        >
      </div>
    </div> -->

    <!-- Navigation Bar -->
    <div id="homepage">
      <nav class="navbar">
        <div class="nav-container">
          <div class="logo">
            <img src="img/logo.png" alt="Suresh Gobi Logo" />
          </div>
          <ul class="nav-menu">
            <li><a href="#">Graphic Design</a></li>
            <li><a href="#">Web Design & Dev</a></li>
            <li><a href="#">WordPress Dev</a></li>
            <li><a href="#">Software Dev</a></li>
            <li><a href="#">SEO Projects</a></li>
          </ul>
        </div>
        <div class="nav-line"></div>
      </nav>

      <div class="horizontal-wrapper">
        <div class="panel hero">
          <div class="hero-content">
            <div class="profile-header">
              <img src="img/propic.png" alt="Suresh Gobi" class="profile-pic" />
              <h2  id="wordsText">Suresh Gobi</h2>
            </div>
            <h1 id="wordsText">
              Designer <span>&</span><br />
              Developer
            </h1>
          </div>
        </div>
        <div class="panel panel2">
          <div class="content-wrapper" id="portfolio-container"></div>
        </div>
        <div class="panel panel3">Project 2</div>
        <div class="panel panel4">Project 3</div>
      </div>

      <!-- Modal -->
      <div id="portfolio-modal" class="modal">
        <div class="modal-content">
          <span class="modal-close">&times;</span>
          <p id="modal-title"></p>
          <div class="modal-body">
            <!-- Left Column -->

            <div class="modal-left">
              <h3>Project Description.</h3>
              <p id="modal-description"></p>
              <h3>Skills and deliverables</h3>
              <div id="modal-skills"></div>
              <div class="modal-buttons">
                <button
                  id="modal-live"
                  target="_blank"
                  class="button-1"
                  role="button"
                >
                  Live Site <i class="fas fa-arrow-right"></i>
                </button>

                <a id="modal-github" target="_blank">
                  <i class="fab fa-github"></i>
                </a>
              </div>

              <div class="modal-meta">
                <p id="modal-published"></p>

                <div id="modal-company"></div>
              </div>
              <hr />
            </div>

            <!-- Right Column -->
            <div class="modal-right">
              <div id="modal-images"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="js/main.js"></script>
    <script src="js/custom-cursor.js"></script>
    <script src="js/bg-image.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/splitText.js"></script>
    <script src="./js/pre-loader.js"></script>
  </body>
</html>
