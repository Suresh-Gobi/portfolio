<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Under Construction</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" type="image/png" href="./img/favicon.png" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GYEWV9EZKE"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-GYEWV9EZKE");
    </script>
    <style>
      body {
        background-color: #f8f9fa;
        color: #222;
        font-family: "Poppins", sans-serif;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .construction-container {
        max-width: 600px;
        background: #fff;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
        animation: fadeIn 1s ease-in-out;
      }

      .construction-container h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #222;
      }

      .construction-container p {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 30px;
      }

      .btn-portfolio {
        background-color: #222;
        color: #fff;
        padding: 12px 28px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .btn-portfolio:hover {
        background-color: #000;
        transform: translateY(-2px);
        color: #fff;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="construction-container">
      <h1>🚧 Website Under Construction</h1>
      <p>
        We’re working hard to bring you something amazing. <br />
        We’ll be back soon. Until then, feel free to view our portfolio below.
      </p>
      <a href="./work.html" class="btn-portfolio">View Portfolio</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
