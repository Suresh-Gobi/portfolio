<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Mobile Menu with Animated Close</title>
    <style>
      :root {
        --color-blue: #1e90ff;
        --color-dark: #202020;
        --color-border-light: #ffffff50;
      }

      body {
        margin: 0;
        background-color: #cecece;
        font-family: "Tw Cen MT", sans-serif;
      }

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 10px 30px;
        z-index: 1000;
      }

      .nav-container {
        height: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo img {
        height: 40px;
      }
      .nav-menu {
        display: flex;
        gap: 80px;
        list-style: none;
      }
      .nav-menu li a {
        text-decoration: none;
        color: #fff;
        text-transform: uppercase;
        font-size: 18px;
        transition: transform 0.3s;
      }
      .nav-menu li a:hover {
        transform: scale(1.2);
      }

      .nav-line {
        height: 0.2px;
        background: #fff;
        opacity: 50%;
        width: 100%;
        margin-top: 1px;
      }

      /* Hide hamburger/menu trigger on desktop */
      .menu-trigger {
        display: none;
      }

      /* Show only on mobile */
      @media (max-width: 768px) {
        .menu-trigger {
          display: flex;
          align-items: center;
          cursor: pointer;
          z-index: 10001;
        }
      }

      .menu-label {
        font-size: 18px;
        color: #fff;
        text-transform: uppercase;
        margin-right: 10px;
        transition: opacity 0.3s ease;
      }

      .btn-hamburger {
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-click {
        width: clamp(4em, 5.5vw, 5em);
        height: clamp(4em, 5.5vw, 5em);
        border-radius: 50%;
        border: 0;
        background-color: var(--color-dark);
        box-shadow: inset 0px 0px 0px 1px var(--color-border-light);
        transition: background-color 0.25s cubic-bezier(0.36, 0, 0.66, 0),
          box-shadow 0.25s cubic-bezier(0.36, 0, 0.66, 0);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Active/Close Animation */
      .btn-hamburger.active .btn-click {
        background-color: var(--color-blue);
        box-shadow: inset 0px 0px 0px 1px transparent !important;
      }

      .btn-bars {
        width: 20px;
        height: 2px;
        background: #fff;
        position: relative;
        transition: all 0.4s ease;
      }
      .btn-bars::before,
      .btn-bars::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 2px;
        background: #fff;
        transition: all 0.4s ease;
      }
      .btn-bars::before {
        top: -6px;
      }
      .btn-bars::after {
        bottom: -6px;
      }

      .btn-hamburger.active .btn-bars {
        background: transparent;
      }
      .btn-hamburger.active .btn-bars::before {
        transform: rotate(45deg) translate(5px, 5px);
      }
      .btn-hamburger.active .btn-bars::after {
        transform: rotate(-45deg) translate(5px, -5px);
      }

      /* Mobile Menu */
      .mobile-menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #202020;
        color: #fff;
        display: flex;
        flex-direction: column;
        z-index: 9999;
        visibility: hidden;
        opacity: 0;
        clip-path: circle(0% at 100% 0%);
      }

      .mobile-menu .menu-top {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 20px 30px;
        width: 100%;
      }

      .menu-inner {
        margin-top: 80px;
        margin-left: 30px;
      }
      .mobile-menu h5 {
        color: #808080;
        font-weight: 100;
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }
      .mobile-menu .stripe {
        height: 1px;
        width: 80%;
        background: #ffffff9a;
        margin-bottom: 20px;
      }
      .mobile-menu ul {
        list-style: none;
        padding: 0;
      }
      .mobile-menu ul li {
        margin: 15px 0;
      }
      .mobile-menu ul li a {
        text-decoration: none;
        color: #fff;
        font-size: 36px;
        text-transform: uppercase;
        transition: color 0.3s;
      }
      .mobile-menu ul li a:hover {
        color: #e62727;
      }

      @media (max-width: 768px) {
        .nav-menu {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo"><img src="img/logo.png" alt="Logo" /></div>
        <ul class="nav-menu">
          <li><a href="#">Work</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div class="menu-trigger" id="menuTrigger">
          <span class="menu-label" id="hamburgerBtn">Menu</span>
        </div>
      </div>
      <div class="nav-line"></div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <div class="menu-top">
        <div class="menu-trigger" id="menuTriggerInside">
          <div class="btn btn-hamburger" id="hamburgerInside">
            <div class="btn-click"><div class="btn-bars"></div></div>
          </div>
        </div>
      </div>
      <div class="menu-inner">
        <div class="menu-nav">
          <h5>Navigation</h5>
          <div class="stripe"></div>
          <ul>
            <li><a href="#">Work</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>
        <div class="menu-socials">
          <h5>Socials</h5>
          <div class="stripe"></div>
          <ul>
            <li><a href="#">Instagram</a></li>
            <li><a href="#">Twitter</a></li>
            <li><a href="#">LinkedIn</a></li>
          </ul>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const hamburgerInside = document.getElementById("hamburgerInside");
        const mobileMenu = document.getElementById("mobileMenu");
        const menuItems = mobileMenu.querySelectorAll("ul li a");

        let menuTimeline = gsap.timeline({ paused: true, reversed: true });

        menuTimeline
          .to(mobileMenu, { visibility: "visible", opacity: 1, duration: 0.2 })
          .to(mobileMenu, {
            clipPath: "circle(150% at 100% 0%)",
            duration: 1.2,
            ease: "power4.inOut",
          })
          .from(
            menuItems,
            {
              opacity: 0,
              y: 40,
              stagger: 0.12,
              duration: 0.6,
              ease: "power3.out",
            },
            "-=0.6"
          );

        function toggleMenu() {
          if (menuTimeline.reversed()) {
            hamburgerBtn.classList.add("active");
            hamburgerInside.classList.add("active");
            menuTimeline.play();
          } else {
            hamburgerBtn.classList.remove("active");
            hamburgerInside.classList.remove("active");
            menuTimeline.reverse();
          }
        }

        document
          .getElementById("menuTrigger")
          .addEventListener("click", toggleMenu);
        document
          .getElementById("menuTriggerInside")
          .addEventListener("click", toggleMenu);
      });
    </script>
  </body>
</html>
