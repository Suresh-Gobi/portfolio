<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Preloader Fill</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #000;
      }

      #logo {
        width: 200px;
        height: 200px;
        background: linear-gradient(
          to bottom,
          rgb(255, 255, 255) 50%,
          rgb(243, 0, 0) 50%
        );
        background-size: 100% 200%;
        background-position: top;
        -webkit-mask-image: url("./svg/logo.svg");
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        -webkit-mask-position: center;
        mask-image: url("./svg/logo.svg");
        mask-repeat: no-repeat;
        mask-size: contain;
        mask-position: center;
        -webkit-mask-composite: destination-in;
        mask-composite: intersect;
        animation: fill 10s forwards;
      }

      @keyframes fill {
        from {
          background-position: top;
        }
        to {
          background-position: bottom;
        }
      }

      .odometer {
        display: flex;
        font-size: 120px;
        color: white;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
      }
      .digit {
        overflow: hidden;
        height: 100px;
        width: 55px;
        position: relative;
        margin: 0 1px;
      }

      .number {
        font-family: monospace;
        font-weight: 500;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      .number div {
        letter-spacing: 0px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="logo"></div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const logo = document.getElementById("logo");
      const totalDuration = 5; // total seconds for logo fill

      // Animate logo fill
      gsap.to(logo, {
        duration: totalDuration,
        backgroundPosition: "bottom",
        ease: "power2.inOut",
      });

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
