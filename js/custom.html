<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rolling Odometer</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #333;
        font-family: sans-serif;
      }

      .odometer {
        display: flex;
        font-size: 60px;
        color: white;
      }

      .digit {
        overflow: hidden;
        height: 100px;
        width: 60px;
        position: relative;
        margin: 0 2px;
      }

      .number {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      .number div {
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="odometer">
      <div class="digit">
        <div class="number" id="digit-1">
          <div>0</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>
      </div>
      <div class="digit">
        <div class="number" id="digit-2">
          <div>0</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>
      </div>
    </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
      function animateOdometer(target, end, duration, onComplete) {
        gsap.to(target, {
          y: -(100 * end),
          duration: duration,
          ease: "power2.out",
          onComplete: onComplete,
        });
      }

      function startOdometerAnimation(finalValue) {
        let currentValue = 0;

        function animateNext() {
          if (currentValue > finalValue) return;

          let tens = Math.floor(currentValue / 10);
          let ones = currentValue % 10;

          // Animate ones place
          animateOdometer("#digit-2", ones, 0.1, () => {
            // Animate tens place when ones rolls over
            if (ones === 0) {
              animateOdometer("#digit-1", tens, 0.3);
            }

            currentValue++;
            animateNext(); // Continue loop
          });
        }

        animateNext();
      }

      // Start odometer up to 25
      startOdometerAnimation(25);
    </script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
