<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Circle Reveal Panels</title>

  <!-- GSAP + ScrollTrigger (your versions) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>

    #container {
      width: 100%;
      height: 100%; 
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-one {
      background-color: #E5E7EB;
    }

    .panel-two {
      background-color: #9CA3AF;
    }

    .panel-three {
      background-color: #4B5563;
    }

    h1 {
      color: white;
      font-size: 2rem;
      z-index: 2;
      position: relative;
    }

    .dot {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      z-index: 1;
      transform-origin: center center;
    }

    .panel-one .dot {
      top: 25%;
      left: 25%;
      background-color: #9CA3AF;
    }

    .panel-two .dot {
      right: 25%;
      bottom: 25%;
      background-color: #4B5563;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="panel panel-one">
      <h1>Section one title</h1>
      <div class="dot"></div>
    </div>
    
    <div class="panel panel-two">
      <h1>Section two title</h1>
      <div class="dot"></div>
    </div>
    
    <div class="panel panel-three">
      <h1>Section three title</h1>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Ensure correct stacking: top panels have lower zIndex
    gsap.set(".panel", {
      zIndex: (i, target, targets) => targets.length - i
    });

    const tl = gsap.timeline({
      defaults: { duration: 1, ease: "none" },
      scrollTrigger: {
        trigger: "#container",
        start: "top top",
        end: "+=300%",
        scrub: true,
        pin: true
      }
    });

    tl
      .to(".panel-one .dot", { scale: 50 })
      .set(".panel-one", { autoAlpha: 0 })

      .to(".panel-two .dot", { scale: 50 })
      .set(".panel-two", { autoAlpha: 0 });
  </script>
</body>
</html>
