<div class="loading-container">
  <div class="loading-screen">
    <div class="numbers">
      <div class="number number-1">
        <div class="number-wrap">
          <p class="number-p">0</p>
          <p class="number-p">1</p>
        </div>
      </div>

      <div class="number number-2 number-ten-times">
        <div class="number-wrap">
          <p class="number-p">0</p>
          <p class="number-p">1</p>
          <p class="number-p">2</p>
          <p class="number-p">3</p>
          <p class="number-p">4</p>
          <p class="number-p">5</p>
          <p class="number-p">6</p>
          <p class="number-p">7</p>
          <p class="number-p">8</p>
          <p class="number-p">9</p>
        </div>
      </div>

      <div class="number number-3 number-ten-times">
        <div class="number-wrap">
          <p class="number-p">0</p>
          <p class="number-p">1</p>
          <p class="number-p">2</p>
          <p class="number-p">3</p>
          <p class="number-p">4</p>
          <p class="number-p">5</p>
          <p class="number-p">6</p>
          <p class="number-p">7</p>
          <p class="number-p">8</p>
          <p class="number-p">9</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.loading-container {
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background:#000;
  display:flex; justify-content:center; align-items:center;
  flex-direction:column;
  z-index:9999;
}

.numbers {
  display:flex;
  gap:5px;
  font-family:'Schabo Condensed', Arial, sans-serif;
  font-weight:700;
  color:#e62727;
  font-size:clamp(40px,8vw,80px);
  overflow:hidden;
}

.number {
  overflow:hidden;
  height:1em;
  width:0.6em;
  position:relative;
}

.number-wrap {
  display:flex;
  flex-direction:column;
  position:absolute;
  top:0;
  left:0; right:0;
}
.number-p {
  height:1em;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const milestones = [0, 36, 58, 76, 94, 100];
const totalDuration = 6; 
const digit1 = document.querySelector(".number-1 .number-wrap");
const digit2 = document.querySelector(".number-2 .number-wrap");
const digit3 = document.querySelector(".number-3 .number-wrap");

// Animate slot-machine for each milestone
let tl = gsap.timeline({defaults:{ease:"power2.inOut"}});

milestones.forEach((milestone, i) => {
  tl.to({}, {
    duration: totalDuration / milestones.length,
    onUpdate: function() {
      const hundreds = Math.floor(milestone / 100);
      const tens = Math.floor((milestone % 100) / 10);
      const ones = milestone % 10;

      gsap.to(digit1, {y: -hundreds + "em", duration:0.3});
      gsap.to(digit2, {y: -tens + "em", duration:0.3});
      gsap.to(digit3, {y: -ones + "em", duration:0.3});
    }
  });
});

// Fade out loader after completion
tl.to(".loading-container", {opacity:0, duration:1, onComplete: ()=>{
  document.querySelector(".loading-container").style.display="none";
}});
</script>
