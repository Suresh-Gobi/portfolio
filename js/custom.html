<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rolling Counter with Logo Fill</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    position: relative;
    font-family: "Bebas Neue", sans-serif;
  }

  #logo {
    width: 200px;
    height: 200px;
    background: linear-gradient(to bottom, white 50%, red 50%);
    background-size: 100% 200%;
    background-position: top;
    -webkit-mask-image: url('./svg/logo.svg');
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    -webkit-mask-position: center;
    mask-image: url('./svg/logo.svg');
    mask-repeat: no-repeat;
    mask-size: contain;
    mask-position: center;
    -webkit-mask-composite: destination-in;
    mask-composite: intersect;
  }

  #counter {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-size: clamp(2rem, 8vw, 6rem);
    color: white;
    display: flex;
    letter-spacing: 0.03em;
  }

  .digit {
    position: relative;
    display: inline-block;
    overflow: hidden;
    height: 1em;
  }

  .digit span {
    display: block;
  }

  .cloneText {
    position: absolute;
    left: 0;
    top: 0;
  }
</style>
</head>
<body>

<div id="logo"></div>
<div id="counter">0%</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const logo = document.getElementById('logo');
const counterEl = document.getElementById('counter');
const totalDuration = 5; // total seconds for logo fill
const checkpoints = [0, 30, 50, 70, 88, 100];

// Animate logo fill
gsap.to(logo, {
  duration: totalDuration,
  backgroundPosition: "bottom",
  ease: "power2.inOut"
});

// Function to create rolling digits like SplitText
function createDigit(num) {
  const digit = document.createElement('div');
  digit.classList.add('digit');

  const original = document.createElement('span');
  original.classList.add('originalText');
  original.textContent = num;

  const clone = document.createElement('span');
  clone.classList.add('cloneText');
  clone.textContent = num;

  digit.appendChild(original);
  digit.appendChild(clone);

  return digit;
}

// Function to update counter for rolling effect
function updateCounter(num) {
  const str = Math.floor(num).toString();
  counterEl.innerHTML = '';
  for (let i = 0; i < str.length; i++) {
    counterEl.appendChild(createDigit(str[i]));
  }

  // Add % sign
  const percent = document.createElement('span');
  percent.textContent = '%';
  counterEl.appendChild(percent);

  // Animate each digit rolling
  const digits = counterEl.querySelectorAll('.digit');
  digits.forEach((digit, i) => {
    gsap.set(digit.children[1], { yPercent: i % 2 === 0 ? -100 : 100 });
    gsap.to(digit.children, {
      yPercent: i % 2 === 0 ? "+=100" : "-=100",
      ease: "power1.inOut",
      duration: 2
    });
  });
}

// Animate counter through checkpoints
const tl = gsap.timeline();
for (let i = 0; i < checkpoints.length - 1; i++) {
  const start = checkpoints[i];
  const end = checkpoints[i + 1];
  const segmentDuration = totalDuration / (checkpoints.length - 1);
  tl.to({ value: start }, {
    value: end,
    duration: segmentDuration,
    ease: "power2.inOut",
    onUpdate: function() {
      updateCounter(this.targets()[0].value);
    }
  });
}
</script>

</body>
</html>
