<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP SplitText Animation</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        gap: 40px;
      }

      .split {
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div class="split" id="charsText">Suresh Gobi - Animate by Characters!</div>
    <div class="split" id="wordsText">Suresh Gobi - Animate by Words!</div>
    <div class="split" id="linesText">Suresh Gobi - Animate by Lines!</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script>
      gsap.registerPlugin(SplitText);

      window.onload = () => {
        function animateText(selector, type, delay = 0) {
          const split = new SplitText(selector, { type: type });
          gsap.from(
            type === "chars"
              ? split.chars
              : type === "words"
              ? split.words
              : split.lines,
            {
              duration: 1,
              y: 50,
              autoAlpha: 0,
              stagger: 0.05,
              ease: "power3.out",
              delay: delay,
            }
          );
        }

        // Animate all on load with slight delays
        animateText("#charsText", "chars", 0);
        animateText("#wordsText", "words", 0.5);
        animateText("#linesText", "lines", 1);
      };
    </script>
  </body>
</html>
