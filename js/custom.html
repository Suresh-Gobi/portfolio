<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Preloader Transition</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      /* Preloader container */
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        z-index: 9999;
      }

      /* Logo fill animation box */
      #logo {
        width: 200px;
        height: 200px;
        background: linear-gradient(to bottom, white 50%, red 50%);
        background-size: 100% 200%;
        background-position: top;
        /* Inline SVG mask (replace with your logo.svg later) */
        -webkit-mask: url("../svg/logo.svg") no-repeat center / contain;
        mask: url("../svg/logo.svg") no-repeat center / contain;
      }

      /* Homepage */
      #home {
        min-height: 100vh;
        background: linear-gradient(to right, #ff416c, #ff4b2b);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 48px;
        font-weight: bold;
        opacity: 0; /* will fade in */
      }
    </style>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader">
      <div id="logo"></div>
    </div>

    <!-- Homepage -->
    <section id="home">🚀 Welcome to the Home Page!</section>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const logo = document.getElementById("logo");
      const preloader = document.getElementById("preloader");
      const home = document.getElementById("home");

      const tl = gsap.timeline({ defaults: { ease: "power2.inOut" } });

      // Step 1: Fill the logo
      tl.to(logo, {
        duration: 2,
        backgroundPosition: "bottom",
      })

        // Step 2: Scale preloader (mask) to reveal homepage
        .to(
          preloader,
          {
            scale: 3000,
            duration: 2, // slower zoom for smoothness
            ease: "power3.inOut",
          },
          "+=0.2"
        )

        // Step 3: Fade in homepage content
        .to(
          home,
          {
            opacity: 1,
            duration: 0.5,
            ease: "power2.inOut",
          },
          "-=1.5"
        )

        // Step 4: Remove preloader after animation
        .to(preloader, {
          opacity: 0,
          duration: 0.5,
          ease: "power1.out",
          onComplete: () => preloader.remove(),
        });
    </script>
  </body>
</html>
