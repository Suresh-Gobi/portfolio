<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Panel Reveal - Corners</title>

    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
        font-family: sans-serif;
      }

      #container {
        height: 300vh; /* scrolling space */
        width: 100%;
      }

      .panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        color: white;
        pointer-events: none;
      }

      .panel1 {
        background: #111;
        z-index: 1;
      }
      .panel2 {
        background: #222;
        z-index: 2;
        opacity: 0;
        clip-path: circle(0% at 100% 0%); /* start from top-right */
      }
      .panel3 {
        background: #555;
        z-index: 3;
        opacity: 0;
        clip-path: circle(0% at 0% 100%); /* start from bottom-left */
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <div class="panel panel1">Panel 1</div>
    <div class="panel panel2">Panel 2</div>
    <div class="panel panel3">Panel 3</div>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      // PANEL 2 reveal (top-right)
      gsap.to(".panel2", {
        scrollTrigger: {
          trigger: "#container",
          start: "top top",
          end: "33% top",
          scrub: 1.2,
        },
        clipPath: "circle(150% at 100% 0%)",
        opacity: 1,
        ease: "expo.inOut",
      });

      // PANEL 3 reveal (bottom-left)
      gsap.to(".panel3", {
        scrollTrigger: {
          trigger: "#container",
          start: "33% top",
          end: "66% top",
          scrub: 1.2,
        },
        clipPath: "circle(150% at 0% 100%)",
        opacity: 1,
        ease: "expo.inOut",
      });
    </script>
  </body>
</html>
