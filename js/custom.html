<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSAP Stacking Cards</title>
<style>
  /* * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  } */

  .spacer,
  .wrapper {
    width: 100%;
    min-height: 100vh;
  }

  .wrapper {
    padding-top: 100px;
    padding-bottom: 50px;
    border-top: dashed 2px var(--color-surface50, #ccc);
    border-bottom: dashed 2px var(--color-surface50, #ccc);
  }

  .card-wrapper {
    width: 100%;
    perspective: 500px;
    margin-bottom: 50px;
  }
  .card-wrapper:last-child {
    margin-bottom: 0;
  }

  .cards {
    width: 90%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .card {
    width: 100%;
    height: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    border-radius: 10px;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: top center;
  }

  .card {
    border-radius: 10px;
    background-image: url("https://assets.codepen.io/16327/portrait-pattern-1.jpg");
  }

  .card.two {
    background-image: url("https://assets.codepen.io/16327/portrait-pattern-2.jpg");
  }

  .card.three {
    background-image: url("https://assets.codepen.io/16327/portrait-pattern-3.jpg");
  }

  .card.four {
    background-image: url("https://assets.codepen.io/16327/portrait-pattern-4.jpg");
  }

  @media (min-width: 768px) {
    .cards {
      width: 80%;
      padding: 0 30px;
    }
  }

  @media (min-width: 1024px) {
    .cards {
      width: 70%;
      padding: 0 50px;
    }
  }
</style>

<!-- GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>


<div class="wrapper">
  <div class="cards">
    <div class="card-wrapper"><div class="card one"></div></div>
    <div class="card-wrapper"><div class="card two"></div></div>
    <div class="card-wrapper"><div class="card three"></div></div>
    <div class="card-wrapper"><div class="card four"></div></div>
  </div>
</div>



<script>
  gsap.registerPlugin(ScrollTrigger);

  const cardsWrappers = gsap.utils.toArray(".card-wrapper");
  const cards = gsap.utils.toArray(".card");

  cardsWrappers.forEach((wrapper, i) => {
    const card = cards[i];
    let scale = 1,
        rotation = 0;
    if (i !== cards.length - 1) {
      scale = 0.9 + 0.025 * i;
      rotation = -10;
    }

    gsap.to(card, {
      scale: scale,
      rotationX: rotation,
      transformOrigin: "top center",
      ease: "none",
      scrollTrigger: {
        trigger: wrapper,
        start: "top 30%",
        end: "bottom bottom",
        // endTrigger: ".wrapper",
        scrub: true,
        pin: wrapper,
        pinSpacing: false,
        markers: true // uncomment to debug
      }
    });
  });
</script>

</body>
</html>
