<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Preloader Fill</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #000;
      }

      #logo {
        width: 200px;
        height: 200px;
        background: linear-gradient(
          to bottom,
          rgb(255, 255, 255) 50%,
          rgb(243, 0, 0) 50%
        );
        background-size: 100% 200%;
        background-position: top;
        -webkit-mask-image: url("./svg/logo.svg");
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        -webkit-mask-position: center;
        mask-image: url("./svg/logo.svg");
        mask-repeat: no-repeat;
        mask-size: contain;
        mask-position: center;
        -webkit-mask-composite: destination-in;
        mask-composite: intersect;
        animation: fill 10s forwards;
      }

      @keyframes fill {
        from {
          background-position: top;
        }
        to {
          background-position: bottom;
        }
      }

      .odometer {
        display: flex;
        font-size: 120px;
        color: white;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
      }
      .digit {
        overflow: hidden;
        height: 100px;
        width: 55px;
        position: relative;
        margin: 0 1px;
      }

      .number {
        font-family: monospace;
        font-weight: 500;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      .number div {
        letter-spacing: 0px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="logo"></div>

    <div class="odometer">
      <div class="digit">
        <div class="number" id="digit-1">
          <div>0</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>
      </div>
      <div class="digit">
        <div class="number" id="digit-2">
          <div>0</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>
      </div>
      <div class="digit">
        <div class="number" id="digit-3">
          <div>0</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const logo = document.getElementById("logo");
      const totalDuration = 5; // total seconds for logo fill

      // Animate logo fill
      gsap.to(logo, {
        duration: totalDuration,
        backgroundPosition: "bottom",
        ease: "power2.inOut",
      });

      // Odometer animation synced with logo fill
      const odometer = { value: 0 }; // current number

      gsap.to(odometer, {
        value: 100, // final number
        duration: totalDuration,
        ease: "power2.inOut",
        onUpdate: () => {
          const currentValue = Math.floor(odometer.value);

          const hundreds = Math.floor(currentValue / 100);
          const tens = Math.floor((currentValue % 100) / 10);
          const ones = currentValue % 10;

          gsap.set("#digit-1", { y: -hundreds * 100 });
          gsap.set("#digit-2", { y: -tens * 100 });
          gsap.set("#digit-3", { y: -ones * 100 });
        },
      });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
